name: .NET

on:
  push:
    branches:
      - main
      - master
      - release/**
    tags:
      - v*
  pull_request:
    branches:
      - main
      - master
      - release/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # Native AOT linking on Linux needs clang and zlib; Windows (MSVC) and macOS
      # (Xcode clang) runners already have a usable toolchain.
      - name: Install Native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      # Native AOT must be built on a matching-OS machine, so each runner packs its
      # own RID-specific, self-contained package.
      - name: Pack Native AOT tool package (${{ matrix.rid }})
        run: dotnet pack src/TrxToSonar/TrxToSonar.csproj --configuration Release -r ${{ matrix.rid }} -p:PublishAot=true --output artifacts

      # The RID-agnostic pointer package and the portable CoreCLR fallback (`any`)
      # are platform-independent, so build them once on Linux.
      - name: Pack pointer and portable fallback packages
        if: runner.os == 'Linux'
        run: |
          dotnet pack src/TrxToSonar/TrxToSonar.csproj --configuration Release -p:PublishAot=true --output artifacts
          dotnet pack src/TrxToSonar/TrxToSonar.csproj --configuration Release -r any -p:PublishAot=false --output artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.rid }}
          path: artifacts/*.nupkg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: packages-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.nupkg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
